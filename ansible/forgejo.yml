---
k3s_cluster:
  children:
    server:
      hosts:
        picard.infrastructure.untouchedwagons.com:

  # Required Vars
  vars:
    k3s_version: v1.36.1+k3s1
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    extra_server_args: "--disable traefik --disable metrics-server"
    cluster_context: forgejo
