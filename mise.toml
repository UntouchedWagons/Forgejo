
[env]
FLATE_PATH = "{{config_root}}/kubernetes/apps"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/_out/talosconfig"

[tools]
# Kubectl + Tools + Plugins
"aqua:kubectl" = "1.37.2"
"github:cloudnative-pg/cloudnative-pg" = "1.30.1"
sofka = "0.39.0"

# Flux Tools
"aqua:fluxcd/flux2" = "2.10.0"
"github:home-operations/flate" = "0.8.0"

# Helm + Plugins
"aqua:helm" = "4.3.2"
helmfile = "1.8.4"

# Talos Stuff
"aqua:talosctl" = "1.14.7"
"github:mirceanton/talstomize" = "1.0.4"

# Misc Tools
just = "1.59.0"
"github:terror/just-lsp" = "0.12.0"
sops = "3.13.3"
age = "1.3.2"
yq = "4.54.3"
krew = "0.5.0"
gum = '2.0.2'

# Cilium
cilium-cli = "0.20.2"

# Terraform
terraform = "1.17.2"

[settings]
# Hold back freshly published tool releases (supply-chain protection).
minimum_release_age = "3d"
