# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
spec:
  # healthChecks:
  interval: 5m
  path: ./kubernetes/apps/default/forgejo/app
  components:
    - ../../../../components/volsync-nfs-backup/
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 10Gi
    substituteFrom:
      # ConfigMaps for non-sensitive values
      - kind: ConfigMap
        name: cluster-vars

  targetNamespace: default
  dependsOn:
    - name: gateway-api
      namespace: kube-system
