# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/tcproute_v1.json
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ssh-route
  namespace: default
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
      sectionName: ssh-tcp
  rules:
    - backendRefs:
        - name: forgejo-ssh
          port: 22
