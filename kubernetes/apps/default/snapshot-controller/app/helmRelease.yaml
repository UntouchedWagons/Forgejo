# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: snapshot-controller
      version: 5.2.0
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: default
      interval: 5m
