# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  values:
    instance:
      sync:
        kind: GitRepository
        url: https://github.com/UntouchedWagons/Forgejo.git
        ref: refs/heads/main
        path: kubernetes/flux/cluster
