apiVersion: config.talstomize.dev/v1alpha1
kind: Talstomize

clusterName: forgejo-test
controlPlaneEndpoint: https://forgejo-test.infrastructure.untouchedwagons.com:6443
secrets: ./talos-secrets.yaml

# Talstomize only supports the metal platform so we have to specify what image to install
installer:
  talosVersion: v1.14.2
  schematic:
    customization:
      extraKernelArgs:
        - cpufreq.default_governor=performance
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/qemu-guest-agent
          - siderolabs/zfs
          - siderolabs/nfs-utils

nodes:
  forgejo-test.infrastructure.untouchedwagons.com:
    ip: 192.168.16.134
    kind: controlplane
    patches:
      - machine:
          install:
            disk: "/dev/sda"

# Applied to every node, regardless of role.
patches:
  - patches/admission-control.yaml
  - patches/filesystem-inotify-changes.yaml
  - patches/zfs.yaml
  - patches/cilium.yaml

controlplanePatches:
  - apiVersion: v1alpha1
    kind: KubeNodeConfig
    taints:
      node-role.kubernetes.io/control-plane:
        $patch: delete

workerPatches: []
